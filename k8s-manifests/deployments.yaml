      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: devacr2s15r.azurecr.io/myapp:9c4b28d926937f39537793ea548dea15805c1959
        ports:
        - containerPort: 5000