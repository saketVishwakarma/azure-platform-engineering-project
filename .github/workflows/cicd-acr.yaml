name: Build and Deploy to AKS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: >
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }

    - name: Login to ACR
      run: az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/myapp:${{ github.sha }} ./app
        docker push ${{ secrets.ACR_NAME }}.azurecr.io/myapp:${{ github.sha }}

    - name: Set AKS Context
      run: az aks get-credentials --resource-group dev-rg --name dev-aks

    - name: Deploy to AKS
      run: |
        kubectl set image deployment/myapp myapp=${{ secrets.ACR_NAME }}.azurecr.io/myapp:${{ github.sha }}
